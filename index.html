  <style amp-custom>
    :root{
      --Baka-bg:#a60a0a;
      --Baka-panel:#a60a0a;
      --Baka-wine:#520000;
      --Baka-ruby:#a60a0a;
      --Baka-red:#a60a0a;
      --Baka-hot:#a60a0a;
      --Baka-pink:#a60a0a;
      --Baka-blue:#167fe6;
      --Baka-text:#a60a0a;
      --Baka-muted:#e5aeb9;
      --Baka-line:rgba(222, 40, 40)
    }

    *{box-sizing:border-box}

    html{background:var(--Baka-bg)}

    body{
      position:relative;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      width:100%;
      min-height:100vh;
      min-height:100svh;
      margin:0;
      padding:18px 9px calc(18px + env(safe-area-inset-bottom));
      overflow-x:hidden;
      color:var(--Baka-text);
      background:
        radial-gradient(circle at 50% -10%,#000000 0%, #000000 29%, #000000 58%, #000000 100%);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      background:
        repeating-linear-gradient(135deg,transparent 0 19px,rgba(255,255,255,.015) 19px 21px),
        radial-gradient(circle at 10% 25%,rgba(255, 31, 31, 0.1),transparent 27%),
        radial-gradient(circle at 90% 75%,rgba(87, 0, 0, 0.2),transparent 30%)
    }

    .Baka-amp-stage{
      position:relative;
      z-index:1;
      width:100%;
      max-width:470px;
      margin:auto
    }

    .Baka-vault-shell{
      position:relative;
      isolation:isolate;
      overflow:hidden;
      background:
        linear-gradient(155deg, #810000, #000000 48%, #810000);
      border:1px solid var(--Baka-line);
      border-radius:26px;
      box-shadow:
        0 24px 60px rgba(107, 0, 0, 0.72),
        0 0 38px rgba(212, 0, 0, 0.2),
        inset 0 1px 0 rgba(255,255,255,.13),
        inset 0 -15px 30px rgba(134, 0, 0, 0.32)
    }

    .Baka-vault-shell::before{
      content:"";
      position:absolute;
      top:0;
      left:8%;
      right:8%;
      z-index:4;
      height:2px;
      background:
        linear-gradient(90deg,transparent,var(--Baka-hot),#ffe0e6,var(--Baka-hot),transparent);
      filter:drop-shadow(0 0 7px var(--Baka-red));
      animation:BakaTopPulse 3s ease-in-out infinite
    }

    .Baka-vault-shell::after{
      content:"";
      position:absolute;
      top:-60%;
      left:-55%;
      z-index:3;
      width:32%;
      height:220%;
      pointer-events:none;
      background:
        linear-gradient(90deg,transparent,rgba(255,255,255,.04),rgba(255,255,255,.2),rgba(255,255,255,.04),transparent);
      transform:rotate(22deg);
      animation:BakaVaultSweep 7s ease-in-out infinite
    }

    .Baka-vault-top{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:13px 15px;
      background:
        linear-gradient(180deg,rgb(222, 40, 40),rgb(222, 40, 40));
      border-bottom:1px solid rgba(255, 0, 0, 0.28);
      box-shadow:inset 0 -8px 16px rgb(222, 40, 40);
      font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      font-size:9px;
      font-weight:800;
      letter-spacing:.35px;
      text-transform:uppercase

    .Baka-vault-mark{
      display:flex;
      align-items:center;
      gap:8px;
      color:#c8c8c8;
    }

    .Baka-vault-gem{
      width:11px;
      height:11px;
      background:linear-gradient(145deg,#000000, #000000);
      border:1px solid rgba(255 255 255 / 70%);
      transform:rotate(45deg);
      box-shadow:0 0 12px rgb(222, 40, 40);
      animation:BakaGemPulse 2.2s ease-in-out infinite
    }

    .Baka-vault-status{
      display:flex;
      align-items:center;
      gap:6px;
      color:#fff
    }

    .Baka-vault-status::before{
      content:"";
      width:7px;
      height:7px;
      background:#58ff9c;
      border-radius:50%;
      box-shadow:0 0 9px rgba(88,255,156,.9);
      animation:BakaStatusBlink 1.5s ease-in-out infinite
    }

    .Baka-vault-body{
      position:relative;
      padding:18px
    }

    .Baka-brand-lockup{
      width:100%;
      max-width:215px;
      margin:0 auto 10px
    }

    .Baka-brand-lockup amp-img{
      filter:drop-shadow(0 0 14px rgba(255,46,88,.38))
    }

    .Baka-kicker{
      position:relative;
      margin:12px 0 17px;
      color:#ededed;;
      font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      font-size:10px;
      font-weight:800;
      line-height:1.6;
      letter-spacing:.35px;
      text-align:center;
      text-transform:uppercase;
      text-shadow:0 0 10px rgb(222, 40, 40)
    }

    .Baka-kicker::before,
    .Baka-kicker::after{
      content:"◆";
      display:inline-block;
      margin:0 8px;
      color:var(--Baka-hot);
      font-size:8px;
      transform:rotate(45deg)
    }

    .Baka-hero-card{
      position:relative;
      padding:5px;
      overflow:hidden;
      background:
        linear-gradient(145deg,rgba(0 0 0 / 34%),rgba(0 0 0 / 35%));
      border:1px solid rgb(222, 40, 213);
      border-radius:18px;

    .Baka-hero-card::before,

      z-index:2;
      width:33px;
      height:33px;
      pointer-events:none
    }

    .Baka-hero-card::before{
      top:9px;
      left:9px;
      border-top:2px solid var(--Baka-hot);
      border-left:2px solid var(--Baka-hot);
      border-radius:7px 0 0
    }

    .Baka-hero-card::after{
      right:9px;
      bottom:9px;
      border-right:2px solid var(--Baka-hot);
      border-bottom:2px solid var(--Baka-hot);
      border-radius:0 0 7px
    }

    .Baka-hero-media{

      overflow:hidden;
      border-radius:13px
    }

    .Baka-hero-media amp-img{display:block}

    .Baka-hero-scan{

      left:0;
      z-index:2;
      width:100%;
      height:18%;
      pointer-events:none;
      background:

      filter:blur(1px);
      animation:BakaScanMove 4.2s linear infinite
    }

    .Baka-feature-strip{

    }

    .Baka-feature-chip{
      position:relative;
      padding:8px 3px;
      color:#000000;
      background:
        linear-gradient(145deg,rgb(222, 40, 213),rgba(222, 40, 213));
      border:1px solid rgba(167 167 167);
      border-radius:9px;
      font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      font-size:8px;
      font-weight:700;
      letter-spacing:.1px;
      text-align:center;
      text-transform:uppercase
    }

    .Baka-feature-chip::before{
      content:"";
      position:absolute;
      top:4px;
      left:50%;
      width:18px;
      height:1px;
      background:var(--Baka-hot);
      box-shadow:0 0 5px var(--Baka-hot);
      transform:translateX(-50%)
    }

    .Baka-access-list{
      display:flex;
      flex-direction:column;
      gap:10px
    }

    .Baka-access-btn{
      position:relative;
      display:grid;
      grid-template-columns:36px 1fr 24px;
      align-items:center;
      min-height:54px;
      padding:8px 13px;
      overflow:hidden;
      color:#fff;
      text-decoration:none;
      text-transform:uppercase;
      border:1px solid transparent;
      border-radius:13px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.17),
        inset 0 -8px 15px rgba(0,0,0,.25),
        0 8px 17px rgba(0,0,0,.34);
      font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      font-size:12px;
      font-weight:800;
      letter-spacing:.45px;
      text-shadow:0 2px 5px rgba(0,0,0,.45);
      transition:filter .2s ease,transform .2s ease
    }

    .Baka-access-btn::before{
      content:"";
      position:absolute;
      top:1px;
      left:4%;
      width:92%;
      height:35%;
      pointer-events:none;
      background:
        linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.04),transparent);
      border-radius:10px 10px 40% 40%
    }

    .Baka-access-btn::after{
      content:"";
      position:absolute;
      top:-90%;
      left:-55%;
      width:30%;
      height:280%;
      pointer-events:none;
      background:
        linear-gradient(90deg,transparent,rgba(255,255,255,.08),rgba(255,255,255,.42),rgba(255,255,255,.08),transparent);
      transform:rotate(22deg);
      animation:BakaButtonShine 4.8s ease-in-out infinite
    }

    .Baka-access-login{
      background:
        linear-gradient(145deg,#a60a0a 0%, #a60a0a 52%, #a60a0a 100%);
      border-color:#777777
    }

    .Baka-access-register{
      background:
        linear-gradient(145deg,#a60a0a 0%, #a60a0a 52%, #a10000 100%);
      border-color:#777777;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        inset 0 -8px 15px rgba(181 0 0 / 30%),
        0 9px 19px rgba(105,0,24,.45),
        0 0 20px rgba(0 0 0 / 18%)
    }

    .Baka-access-alt{
      background:
        linear-gradient(145deg,#a60a0a 0%, #a60a0a 52%, #a10000 100%);
      border-color:#777777;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.22),
        inset 0 -8px 15px rgba(65 0 0 / 30%),
        0 9px 19px rgba(0 0 0 / 43%),
        0 0 18px rgba(0 0 0 / 17%)
    }

    .Baka-btn-index{
      position:relative;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:center;
      width:30px;
      height:30px;
      color:#fff;
      background:rgba(20,0,5,.3);
      border:1px solid rgba(255,255,255,.24);
      border-radius:9px;
      font-size:9px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.12)
    }

    .Baka-btn-label{
      position:relative;
      z-index:2;
      text-align:center
    }

    .Baka-btn-arrow{
      position:relative;
      z-index:2;
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      font-size:24px;
      font-weight:400;
      text-align:right;
      transition:transform .2s ease
    }

    .Baka-access-btn:hover{
      color:#fff;
      filter:brightness(1.1);
      transform:translateY(-2px)
    }

    .Baka-access-btn:hover .Baka-btn-arrow{
      transform:translateX(3px)
    }

    .Baka-access-btn:active{
      transform:scale(.98)
    }

    .Baka-vault-footer{
      position:relative;
      padding:13px 12px;
      color:#ffffff;
      background:
        linear-gradient(180deg,rgba(120, 4, 187, 0.rgba(40, 0, 67, 0.96)96%));
      border-top:1px solid rgb(222, 40, 213);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      font-size:8px;
      font-weight:600;
      letter-spacing:.25px;
      text-align:center;
      text-transform:uppercase
    }

    .Baka-opening{
      position:absolute;
      inset:0;
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      pointer-events:none;
      background:#100004;
      animation:BakaOpeningHide .7s cubic-bezier(.22,1,.36,1) 2.35s forwards
    }

    .Baka-opening::before,
    .Baka-opening::after{
      content:"";
      position:absolute;
      top:0;
      bottom:0;
      width:51%;
      background:
        radial-gradient(circle at center,rgba(174, 0, 174, 0.35),transparent 55%),
        linear-gradient(145deg,#a60a99,#7a0074 58%,#a60a99);
      box-shadow:inset 0 0 30px rgba(222, 40, 213);
      animation-duration:.85s;
      animation-timing-function:cubic-bezier(.77,0,.18,1);
      animation-delay:1.75s;
      animation-fill-mode:forwards
    }

    .Baka-opening::before{
      left:0;
      border-right:1px solid rgba(222, 40, 213);
      animation-name:BakaPanelLeft
    }

    .Baka-opening::after{

      right:0;
      border-left:1px solid rgba(222, 40, 213);
      animation-name:BakaPanelRight
    }

    .Baka-opening-center{
      position:relative;
      z-index:3;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center
    }

    .Baka-opening-seal{
      position:relative;
      width:72px;
      height:72px;
      margin-bottom:24px;
      opacity:0;
      transform:rotate(45deg) scale(.15);
      background:
        linear-gradient(145deg,#c614cc,#000000 48%,#c614cc);
      border:2px solid #cecece;
      box-shadow:
        0 0 0 7px rgba(0, 0, 0, 0.2),
        0 0 35px rgba(0, 0, 0, 0.8),
        inset 0 1px 0 rgba(255,255,255,.35),
        inset 0 -9px 18px rgba(131, 0, 0, 0.32);
      animation:BakaSealReveal 1.05s cubic-bezier(.22,1,.36,1) .1s forwards
    }

    .Baka-opening-seal::before,
    .Baka-opening-seal::after{
      content:"";
      position:absolute;
      top:50%;
      left:50%;
      background:#fff;
      box-shadow:0 0 9px rgba(255,255,255,.72);
      transform:translate(-50%,-50%)
    }

    .Baka-opening-seal::before{
      width:28px;
      height:3px
    }

    .Baka-opening-seal::after{
      width:3px;
      height:28px
    }

    .Baka-opening-brand{
      position:relative;
      overflow:hidden;
      color:#fff;
      font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      font-size:25px;
      font-weight:800;
      line-height:1;
      letter-spacing:4px;
      text-align:center;
      text-shadow:
        0 0 17px rgba(222, 40, 213),
        0 4px 14px rgba(0,0,0,.55);
      opacity:0;
      transform:translateY(18px);
      animation:BakaBrandReveal .75s cubic-bezier(.22,1,.36,1) .7s forwards
    }

    .Baka-opening-brand::after{
      content:"";
      position:absolute;
      top:0;
      bottom:0;
      left:-55%;
      width:30%;
      background:
        linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
      transform:skewX(-18deg);
      animation:BakaBrandShine .75s ease 1.18s forwards
    }

    .Baka-opening-line{
      width:0;
      height:2px;
      margin-top:15px;
      background:
        linear-gradient(90deg,transparent,var(--Baka-hot),#fff,var(--Baka-hot),transparent);
      box-shadow:0 0 11px rgba(222, 40, 213);
      animation:BakaLineExpand .65s ease 1s forwards
    }

    .Baka-opening-subtitle{
      margin-top:10px;
      color:#e0e0e0;
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      font-size:9px;
      font-weight:600;
      letter-spacing:1.5px;
      text-transform:uppercase;
      opacity:0;
      animation:BakaSubtitleReveal .5s ease 1.2s forwards
    }

    @keyframes BakaTopPulse{
      0%,100%{opacity:.42;transform:scaleX(.7)}
      50%{opacity:1;transform:scaleX(1)}
    }

    @keyframes BakaVaultSweep{
      0%,28%{left:-55%;opacity:0}
      42%{opacity:.65}
      65%,100%{left:130%;opacity:0}
    }

    @keyframes BakaGemPulse{
      0%,100%{
        opacity:.55;
        box-shadow:0 0 8px rgb(222, 40, 213)
      }
      50%{
        opacity:1;
        box-shadow:0 0 17px rgba(222, 40, 213)
      }
    }

    @keyframes BakaStatusBlink{
      0%,100%{opacity:.45}
      50%{opacity:1}
    }

    @keyframes BakaScanMove{
      0%{top:-20%;opacity:0}
      15%{opacity:1}
      75%{opacity:.75}
      100%{top:115%;opacity:0}
    }

    @keyframes BakaButtonShine{
      0%,35%{left:-55%;opacity:0}
      48%{opacity:.75}
      68%,100%{left:130%;opacity:0}
    }

    @keyframes BakaSealReveal{
      0%{
        opacity:0;
        transform:rotate(45deg) scale(.15)
      }
      65%{
        opacity:1;
        transform:rotate(225deg) scale(1.12)
      }
      100%{
        opacity:1;
        transform:rotate(225deg) scale(1)
      }
    }

    @keyframes BakaBrandReveal{
      to{
        opacity:1;
        transform:translateY(0);
        letter-spacing:2.8px
      }
    }

    @keyframes BakaBrandShine{
      to{left:130%}
    }

    @keyframes BakaLineExpand{
      to{width:180px}
    }

    @keyframes BakaSubtitleReveal{
      to{opacity:.8}
    }

    @keyframes BakaPanelLeft{
      to{transform:translateX(-105%)}
    }

    @keyframes BakaPanelRight{
      to{transform:translateX(105%)}
    }

    @keyframes BakaOpeningHide{
      to{
        opacity:0;
        visibility:hidden
      }
    }

    @media(min-height:780px){
      body{align-items:center}
    }

    @media(max-width:480px){
      body{
        padding:11px 7px calc(11px + env(safe-area-inset-bottom))

      .Baka-vault-shell{border-radius:21px}

        padding:11px 12px;
        font-size:8px
      }

      .Baka-vault-body{padding:14px}

      .Baka-brand-lockup{max-width:190px}

      .Baka-kicker{

        font-size:9px
      }

      .Baka-hero-card{border-radius:15px}

      .Baka-feature-strip{
        gap:4px;
        margin:10px 0 13px
      }

      .Baka-feature-chip{
        padding:7px 2px;
        font-size:7px
      }

      .Baka-access-list{gap:8px}

      .Baka-access-btn{
        grid-template-columns:32px 1fr 20px;
        min-height:50px;
        padding:7px 10px;
        font-size:11px
      }

      .Baka-btn-index{

      .Baka-vault-footer{

        font-size:7px
      }

      .Baka-opening-seal{

        height:60px;
        margin-bottom:20px
      }

      .Baka-opening-brand{
        font-size:21px;
        letter-spacing:3px
      }

      .Baka-opening-subtitle{
